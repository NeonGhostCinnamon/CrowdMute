name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      Solution_Name: CrowdMute

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
        shell: pwsh

      - name: Build
        run: dotnet build --configuration Release

      - name: Package
        run: |
          mkdir package
          # Copy DLLs and deps directly into the package root (not inside latest.zip)
          Copy-Item bin\Release\CrowdMute.dll package\
          Copy-Item bin\Release\CrowdMute.json package\
          Copy-Item bin\Release\CrowdMute.deps.json package\

          Copy-Item -Recurse bin\Release\images package\
          cd package
          7z a ../CrowdMute.zip .
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: CrowdMute.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
