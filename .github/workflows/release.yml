name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Package
        run: |
          mkdir package
          cp bin/Release/CrowdMute.dll package/
          cp -r bin/Release/CrowdMute package/
          cp -r images package/
          cd package
          7z a ../CrowdMute.zip .
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CrowdMute.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
