name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      Solution_Name: CrowdMute

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = git describe --tags --exact-match 2>$null || git tag --points-at HEAD | Select-Object -First 1
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Sync AssemblyVersion in repo.json
        shell: bash
        run: |
          # Take the version from the tag, e.g. v2.0.6 -> 2.0.6.0
          TAG="${GITHUB_REF_NAME#v}"
          FULL_VERSION="$TAG"
          # Pad to four parts
          while [ "$(echo "$FULL_VERSION" | tr -cd '.' | wc -c)" -lt 3 ]; do
            FULL_VERSION="$FULL_VERSION.0"
          done

          # Fail loudly if the version is empty or invalid
          if ! echo "$FULL_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Bad version: '$FULL_VERSION'"
            exit 1
          fi

          echo "Syncing AssemblyVersion to $FULL_VERSION"
          jq --arg v "$FULL_VERSION" '.[0].AssemblyVersion = $v' repo.json > tmp.json && mv tmp.json repo.json
          echo "Updated AssemblyVersion"

      - name: Commit synced repo.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add repo.json
          git commit -m "Sync AssemblyVersion to ${{ steps.version.outputs.VERSION }}.0" || echo "No changes to commit"
          git push origin HEAD:master
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
        shell: pwsh

      - name: Build
        run: dotnet build --configuration Release

      - name: Package
        run: |
          mkdir package
          # Copy DLLs and deps directly into the package root (not inside latest.zip)
          Copy-Item bin\Release\CrowdMute.dll package\
          Copy-Item bin\Release\CrowdMute.json package\
          Copy-Item bin\Release\CrowdMute.deps.json package\

          Copy-Item -Recurse bin\Release\images package\
          cd package
          7z a ../CrowdMute.zip .
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: CrowdMute.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
