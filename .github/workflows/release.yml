name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Download Dalamud SDK
        run: |
          $url = "https://repo.dalamud.dev/Packager.Latest.zip"
          Invoke-WebRequest -Uri $url -OutFile Packager.Latest.zip
          Expand-Archive -Path Packager.Latest.zip -DestinationPath dalamud-sdk -Force
        shell: pwsh

      - name: Add Dalamud NuGet source
        run: |
          $pkgPath = "${{ github.workspace }}/dalamud-sdk/Packager"
          $nugetConfig = @'
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
              <add key="dalamud" value="$env:PKG_PATH/Packager" />
            </packageSources>
          </configuration>
          '@
          $nugetConfig = $nugetConfig -replace '\$env:PKG_PATH', $pkgPath
          Set-Content -Path nuget.config -Value $nugetConfig
        shell: pwsh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Package
        run: |
          mkdir package
          cp bin/Release/CrowdMute.dll package/
          cp -r bin/Release/CrowdMute package/
          cp -r images package/
          cd package
          7z a ../CrowdMute.zip .
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CrowdMute.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
