name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      Solution_Name: CrowdMute

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = git describe --tags --exact-match 2>$null || git tag --points-at HEAD | Select-Object -First 1
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Sync repo.json AssemblyVersion
        run: |
          $json = Get-Content repo.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "${{ steps.version.outputs.VERSION }}.0"
          $json | ConvertTo-Json -Depth 10 | Set-Content repo.json
        shell: pwsh

      - name: Commit synced repo.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add repo.json
          git commit -m "Sync AssemblyVersion to ${{ steps.version.outputs.VERSION }}.0" || echo "No changes to commit"
          git push origin HEAD:master
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
        shell: pwsh

      - name: Build
        run: dotnet build --configuration Release

      - name: Package
        run: |
          mkdir package
          # Copy DLLs and deps directly into the package root (not inside latest.zip)
          Copy-Item bin\Release\CrowdMute.dll package\
          Copy-Item bin\Release\CrowdMute.json package\
          Copy-Item bin\Release\CrowdMute.deps.json package\

          Copy-Item -Recurse bin\Release\images package\
          cd package
          7z a ../CrowdMute.zip .
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: CrowdMute.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
